<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>喵不可言：終極拯救</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background:#050508; display:flex; align-items:center; justify-content:center; 
            min-height:100vh; font-family:'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            overflow:hidden; user-select:none; color: white; 
        }

        /* 標題畫面 */
        #titleScreen {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: #000 url('assets/title_bg.png') center no-repeat; background-size: cover;
            z-index: 3000; display: flex; align-items: center; justify-content: center; transition: 0.8s;
        }
        .vertical-title {
            position: absolute; left: 10%; top: 15%; font-size: 55px; font-weight: bold;
            color: #f8f9fa; writing-mode: vertical-rl; text-orientation: upright;
            text-shadow: 0 0 15px rgba(255,255,255,0.8); letter-spacing: 15px;
        }
        .center-bottom-btn {
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #ff416c, #ff4b2b); padding: 15px 60px;
            border: 2px solid #fff; color: white; font-size: 24px; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 65, 108, 0.5); font-weight: bold;
        }

        /* 選單介面 */
        #menuOverlay { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: radial-gradient(circle at center, #0f0f1a 0%, #050508 100%); 
            z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
        }
        .modules-wrapper { display: flex; gap: 25px; width: 98%; max-width: 1200px; }
        .module-card { 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            border-radius: 25px; 
            padding: 25px; 
            flex: 1; 
        }
        .module-card h2 { font-size: 24px; text-align: center; color: #4facfe; margin-bottom: 20px; }
        .preview-box { 
            height: 220px; 
            background: rgba(0,0,0,0.5); 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            position: relative; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .preview-box img { width: 120px; height: 120px; object-fit: contain; z-index: 2; margin: 0 10px; }
        #pre-bg-layer { position:absolute; width:100%; height:100%; background-size:cover; background-position: center; filter:brightness(0.6); z-index: 1; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .opt-btn { background: rgba(255, 255, 255, 0.1); color: #ccc; border: none; padding: 12px; cursor: pointer; border-radius: 12px; flex: 1; font-size: 16px; font-weight: bold; }
        .opt-btn.active { background: #fff; color: #000; }
        .launch-btn { width: 300px; padding: 20px; background: linear-gradient(90deg, #ff416c, #ff4b2b); border: none; color: white; border-radius: 50px; font-weight: bold; font-size: 22px; cursor: pointer; margin: 10px; }

        /* 遊戲畫面 */
        #gameWrapper { display: none; flex-direction: row; border: 4px solid #333; background: #111; position: relative; }
        #sidebar { width: 180px; background: #1a1a24; border-left: 2px solid #333; display: flex; flex-direction: column; padding: 20px 15px; gap: 15px; }
        .info-label { color: #4facfe; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .info-value { font-size: 22px; font-weight: bold; color: #fff; }
        .hp-value { color: #ff416c; font-size: 14px; word-break: break-all; }

        /* 操作說明樣式 */
        .how-to-play { 
            margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; 
            font-size: 13px; color: #aaa; line-height: 1.6;
        }
        .how-to-play b { color: #fff; }

        .ult-bar-frame { width: 100%; height: 200px; background: #000; border: 2px solid #444; border-radius: 10px; position: relative; overflow: hidden; }
        #ultBarFill { position: absolute; bottom: 0; width: 100%; height: 0%; background: linear-gradient(0deg, #f8b500, #ff416c); transition: height 0.1s; }
        
        #ultCutIn { position: absolute; top: 50%; left: 40%; transform: translate(-50%, -50%) scale(0); width: 60%; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        #ultCutIn.active { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        #resultOverlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); z-index: 4000; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .thanks-msg { color: #f8b500; font-size: 24px; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body onclick="document.getElementById('bgm').play()">

<audio id="bgm" loop><source src="assets/bgm.MP3" type="audio/mpeg"></audio>
<audio id="hitSound"><source src="assets/hit.mp3" type="audio/mpeg"></audio>
<audio id="meow_black"><source src="assets/meow_black.mp3" type="audio/mpeg"></audio>
<audio id="meow_orange"><source src="assets/meow_orange.mp3" type="audio/mpeg"></audio>
<audio id="meow_white"><source src="assets/meow_white.mp3" type="audio/mpeg"></audio>
<audio id="ult_roar"><source src="assets/ult_sound.mp3" type="audio/mpeg"></audio>

<div id="titleScreen">
    <div class="vertical-title">喵不可言</div>
    <button class="center-bottom-btn" onclick="openMenu()">開 始 !</button>
</div>

<div id="menuOverlay">
    <div class="modules-wrapper">
        <div class="module-card">
            <h2>選擇角色</h2>
            <div class="preview-box"><img id="pre-cat" src="assets/black.png"><img id="pre-bite" src="assets/black_bite.png"></div>
            <div class="btn-group">
                <button class="opt-btn active" onclick="select('cat','black',this)">小黑</button>
                <button class="opt-btn" onclick="select('cat','orange',this)">小橘</button>
                <button class="opt-btn" onclick="select('cat','white',this)">小白</button>
            </div>
        </div>
        <div class="module-card">
            <h2>選擇武器</h2>
            <div class="preview-box"><img id="pre-wp" src="assets/hand.png" style="width:130px; height:130px;"></div>
            <div class="btn-group">
                <button class="opt-btn active" onclick="select('wp','hand',this)">貓掌</button>
                <button class="opt-btn" onclick="select('wp','rocket',this)">火箭筒</button>
            </div>
        </div>
        <div class="module-card">
            <h2>選擇戰場</h2>
            <div class="preview-box"><div id="pre-bg-layer" style="background-image:url('assets/lawn.png');"></div></div>
            <div class="btn-group">
                <button class="opt-btn active" onclick="select('bg','lawn',this)">草原</button>
                <button class="opt-btn" onclick="select('bg','wood',this)">木地板</button>
            </div>
        </div>
    </div>
    <button class="launch-btn" onclick="startGame()">出 擊</button>
</div>

<div id="gameWrapper">
    <img id="ultCutIn" src="">
    <canvas id="gameCanvas" width="600" height="700"></canvas>
    <div id="sidebar">
        <div><div class="info-label">當前關卡</div><div id="lvlTxt" class="info-value">LV. 1</div></div>
        <div><div class="info-label">九連戰 HP</div><div id="hpTxt" class="hp-value">♥♥♥♥♥♥♥♥♥</div></div>
        <div><div class="info-label">Score</div><div id="scrTxt" class="info-value">000000</div></div>
        
        <div class="how-to-play">
            <div class="info-label" style="color: #f8b500;">操作說明</div>
            <div><b>↑↓←→</b>：移動</div>
            <div><b>Space</b>：撕咬</div>
            <div><b>Z</b>：發射武器</div>
            <div><b>Shift</b>：放大招</div>
        </div>

        <div style="margin-top:auto">
            <div class="info-label">Ultimate [Shift]</div>
            <div class="ult-bar-frame"><div id="ultBarFill"></div></div>
        </div>
    </div>
    <div id="resultOverlay">
        <h1 id="resTitle" style="color:#f8b500; font-size:40px;">拯救世界成功！</h1>
        <p id="thanksMsg" class="thanks-msg">謝謝您拯救了世界喵！</p>
        <p id="resScore" style="font-size:20px; margin-bottom:20px;">最終得分: 000000</p>
        <button class="launch-btn" onclick="backToMenu()">再戰一回</button>
        <button class="launch-btn" style="background: #444;" onclick="backToMenu()">回到主選單</button>
    </div>
</div>

<script>
    let config = { cat: 'black', wp: 'hand', bg: 'lawn' };
    let score = 0, currentLevel = 1, hp = 9, ultEnergy = 0;
    let isUltActive = false, ultTimer = 0, gameActive = false;
    let screenShake = 0, hurtTimer = 0;
    let player = { x: 260, y: 550, w: 90, h: 110, isBiting: false, biteTimer: 0, shootTimer: 0 };
    let enemies = [], bullets = [], particles = [];
    let keys = {};
    const imgStore = {};

    let lastTime = 0;
    const fps = 60; 
    const interval = 1000 / fps;

    // 音效播放優化，確保大招音效能正確觸發
    function playSound(id) {
        const s = document.getElementById(id);
        if(s) { 
            s.pause(); // 先停止
            s.currentTime = 0; 
            s.play().catch(e => console.log("音效播不出來可能是瀏覽器限制:", e)); 
        }
    }

    function openMenu() {
        document.getElementById('titleScreen').style.display = 'none';
        document.getElementById('menuOverlay').style.display = 'flex';
    }

    function backToMenu() {
        document.getElementById('resultOverlay').style.display = 'none';
        document.getElementById('gameWrapper').style.display = 'none';
        document.getElementById('menuOverlay').style.display = 'flex';
        score = 0; currentLevel = 1; hp = 9; ultEnergy = 0;
        enemies = []; bullets = []; particles = [];
        isUltActive = false;
    }

    function select(type, val, btn) {
        config[type] = val;
        Array.from(btn.parentNode.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(type==='cat') {
            document.getElementById('pre-cat').src = `assets/${val}.png`;
            document.getElementById('pre-bite').src = `assets/${val}_bite.png`;
        } else if(type==='wp') {
            document.getElementById('pre-wp').src = `assets/${val}.png`;
        } else if(type==='bg') {
            let ext = (val === 'wood') ? 'jpg' : 'png';
            document.getElementById('pre-bg-layer').style.backgroundImage = `url('assets/${val}.${ext}')`;
        }
    }

    function spawnBlood(x, y, count, isMega = false) {
        for(let i=0; i<count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * (isMega ? 20 : 12),
                vy: (Math.random() - 0.5) * (isMega ? 20 : 12),
                size: Math.random() * (isMega ? 7 : 4) + 2,
                life: isMega ? 35 : 20
            });
        }
    }

    function startGame() {
        document.getElementById('menuOverlay').style.display = 'none';
        document.getElementById('gameWrapper').style.display = 'flex';
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        imgStore.hero = new Image(); imgStore.hero.src = `assets/${config.cat}.png`;
        imgStore.bite = new Image(); imgStore.bite.src = `assets/${config.cat}_bite.png`;
        imgStore.wp = new Image(); imgStore.wp.src = `assets/${config.wp}.png`;
        
        let bgExt = (config.bg === 'wood') ? 'jpg' : 'png';
        imgStore.bg = new Image(); imgStore.bg.src = `assets/${config.bg}.${bgExt}`;
        
        imgStore.bug = new Image(); imgStore.bug.src = 'assets/bug.png';
        imgStore.mouse = new Image(); imgStore.mouse.src = 'assets/mouse.png';
        document.getElementById('ultCutIn').src = `assets/${config.cat}_bite.png`;

        gameActive = true;
        ultEnergy = 0; 
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;
        
        lastTime = performance.now();
        function loop(timestamp) {
            if(!gameActive) return;
            const elapsed = timestamp - lastTime;
            if (elapsed > interval) {
                lastTime = timestamp - (elapsed % interval);
                update();
                draw(ctx, canvas);
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    }

    function update() {
        if(screenShake > 0) screenShake--;
        if(hurtTimer > 0) hurtTimer--;
        if(!isUltActive && ultEnergy < 100) ultEnergy += 0.25;
        document.getElementById('ultBarFill').style.height = ultEnergy + '%';

        // 觸發大招處
        if((keys['ShiftLeft'] || keys['ShiftRight']) && ultEnergy >= 100 && !isUltActive) {
            isUltActive = true; 
            ultTimer = 180; 
            ultEnergy = 0;
            playSound('ult_roar'); // 播放大招聲音
            const cutIn = document.getElementById('ultCutIn');
            cutIn.classList.add('active');
            setTimeout(() => cutIn.classList.remove('active'), 800);
        }

        if(keys['ArrowLeft'] && player.x > 0) player.x -= 8;
        if(keys['ArrowRight'] && player.x < 600 - player.w) player.x += 8;
        if(keys['ArrowUp'] && player.y > 0) player.y -= 8;
        if(keys['ArrowDown'] && player.y < 700 - player.h) player.y += 8;
        if(keys['KeyZ'] && player.shootTimer === 0) {
            bullets.push({ x: player.x+30, y: player.y, w:25, h:35, vx:0, vy:-15 });
            player.shootTimer = 10;
        }
        if(player.shootTimer > 0) player.shootTimer--;
        if(isUltActive) {
            ultTimer--; screenShake = 2;
            if(ultTimer % 4 === 0) {
                for(let i=-2; i<=2; i++) bullets.push({ x: player.x+30, y: player.y, w:35, h:45, vx:i*6, vy:-20, isUlt:true });
            }
            if(ultTimer <= 0) isUltActive = false;
        }
        if(keys['Space'] && player.biteTimer === 0) {
            player.isBiting = true; player.biteTimer = 15;
            playSound(`meow_${config.cat}`);
        }
        if(player.biteTimer > 0) player.biteTimer--; else player.isBiting = false;
        let type = (currentLevel <= 2) ? 'bug' : 'mouse';
        document.getElementById('lvlTxt').innerText = `LV. ${currentLevel} (${currentLevel<=2?'蟑螂':'老鼠'})`;
        if(Math.random() < 0.03 + currentLevel * 0.01) {
            let isElite = Math.random() < 0.2;
            let sz = isElite ? 110 : 60;
            enemies.push({ x: Math.random()*(600-sz), y:-sz, w:sz, h:sz, type, hp:isElite?6:1, maxHp:isElite?6:1, isElite, flash:0 });
        }
        enemies.forEach((en, ei) => {
            en.y += (3 + currentLevel * 0.5);
            if(en.flash > 0) en.flash--;
            bullets.forEach((b, bi) => {
                if(b.x < en.x+en.w && b.x+b.w > en.x && b.y < en.y+en.h && b.y+b.h > en.y) {
                    en.hp--; en.flash = 5; bullets.splice(bi, 1);
                    playSound('hitSound');
                    spawnBlood(b.x, b.y, 5);
                    if(en.hp <= 0) {
                        spawnBlood(en.x+en.w/2, en.y+en.h/2, 15, true);
                        enemies.splice(ei, 1); score += 20;
                    }
                }
            });
            if(player.isBiting && Math.hypot((player.x+40)-(en.x+en.w/2), (player.y+40)-(en.y+en.h/2)) < 110) {
                spawnBlood(en.x+en.w/2, en.y+en.h/2, 40, true);
                enemies.splice(ei, 1); score += 50; screenShake = 20;
                playSound('hitSound');
            }
            if(hurtTimer === 0 && player.x < en.x+en.w-10 && player.x+player.w > en.x+10 && player.y < en.y+en.h-10 && player.y+player.h > en.y+10) {
                hp--; hurtTimer = 60; screenShake = 30;
                document.getElementById('hpTxt').innerText = "♥".repeat(Math.max(0, hp));
                if(hp <= 0) gameOver(false);
            }
            if(en.y > 700) enemies.splice(ei, 1);
        });
        if(score >= currentLevel * 500) {
            if(currentLevel < 4) currentLevel++;
            else if(enemies.length === 0) gameOver(true);
        }
        bullets.forEach((b, i) => { b.x += (b.vx||0); b.y += b.vy; if(b.y < -50) bullets.splice(i, 1); });
        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if(p.life <= 0) particles.splice(i, 1); });
        document.getElementById('scrTxt').innerText = score.toString().padStart(6, '0');
    }

    function gameOver(isWin) {
        gameActive = false;
        document.getElementById('resultOverlay').style.display = 'flex';
        document.getElementById('resTitle').innerText = isWin ? "任務完成！" : "戰敗了...";
        document.getElementById('resTitle').style.color = isWin ? "#f8b500" : "#ff416c";
        document.getElementById('thanksMsg').style.display = isWin ? "block" : "none";
        document.getElementById('resScore').innerText = "最終得分: " + score;
    }

    function draw(ctx, canvas) {
        ctx.save();
        if(screenShake > 0) ctx.translate(Math.random()*screenShake-screenShake/2, Math.random()*screenShake-screenShake/2);
        ctx.drawImage(imgStore.bg, 0, 0, 600, 700);
        particles.forEach(p => {
            ctx.fillStyle = `rgba(220, 20, 60, ${p.life / 20})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        enemies.forEach(en => {
            if(en.flash > 0) en.flash--;
            if(en.flash > 0) ctx.filter = "brightness(3)";
            ctx.drawImage(imgStore[en.type], en.x, en.y, en.w, en.h);
            ctx.filter = "none";
            if(en.isElite) {
                ctx.fillStyle = "#000"; ctx.fillRect(en.x, en.y-12, en.w, 6);
                ctx.fillStyle = "#f00"; ctx.fillRect(en.x, en.y-12, en.w*(en.hp/en.maxHp), 6);
            }
        });
        if(hurtTimer % 10 > 5) ctx.globalAlpha = 0.3;
        ctx.drawImage(player.isBiting ? imgStore.bite : imgStore.hero, player.x, player.y, player.w, player.h);
        ctx.globalAlpha = 1;
        bullets.forEach(b => {
            if(b.isUlt) ctx.filter = "hue-rotate(180deg) brightness(1.5)";
            ctx.drawImage(imgStore.wp, b.x, b.y, b.w, b.h);
            ctx.filter = "none";
        });
        ctx.restore();
    }
</script>
</body>
</html>
