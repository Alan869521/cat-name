<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>喵不可言：魚骨行動</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0f;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh;
  font-family:'Microsoft JhengHei', sans-serif;
  overflow:hidden; user-select:none;
}
#title { color:#ff6b35; font-size:24px; font-weight:bold; margin-bottom:6px;
  text-shadow:0 0 20px rgba(255,107,53,0.7); letter-spacing:3px; }
#subtitle { color:#777; font-size:12px; margin-bottom:10px; letter-spacing:2px; }

/* 確保遊戲包裝層是橫向排列 */
#gameWrapper { 
  display: flex; 
  flex-direction: row; 
  gap: 20px; 
  align-items: flex-start; 
}

canvas { 
  display: block; 
  border: 2px solid #ff6b35; 
  border-radius: 8px; 
  box-shadow: 0 0 30px rgba(255,107,53,0.4); 
}

#panel {
  color:#ddd; width:160px; font-size:12px; line-height:1.7;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,107,53,0.25); border-radius:8px; padding:15px;
}
#panel h3 { color:#ff6b35; font-size:14px; margin-bottom:8px;
  border-bottom:1px solid rgba(255,107,53,0.25); padding-bottom:5px; }
.key { display:inline-block; background:rgba(255,107,53,0.15);
  border:1px solid #ff6b35; border-radius:3px; padding:0 5px;
  font-size:10px; color:#ff6b35; }
#panel .tip { color:#888; font-size:11px; margin-top:4px; }
</style>
</head>
<body>
<div id="title">喵不可言：魚骨行動</div>
<div id="subtitle">MEOW UNSPEAKABLE · FISHBONE OPERATION</div>
<div id="gameWrapper">
  <canvas id="game" width="800" height="500"></canvas>
  <div id="panel">
    <h3>🎮 操作</h3>
    <div><span class="key">←→↑↓</span> 移動</div>
    <div><span class="key">Z</span> 發射魚骨</div>
    <div><span class="key">空白鍵</span> 撕咬</div>
    <div><span class="key">P</span> 暫停</div>
    <div><span class="key">Enter</span> 重新開始</div>
    <br>
    <h3>🎯 道具</h3>
    <div>🥩 鼠肉 → 經驗值</div>
    <div>🥛 牛奶 → 無敵狂暴</div>
    <div>罐頭 → 生命保護</div>
    <br>
    <h3>⚔️ 成長</h3>
    <div>Lv3 → 雙發齊射</div>
    <div>Lv5 → 三發齊射</div>
    <div class="tip">收集鼠肉升等強化。</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- 圖片預載入 ---
const catImg = new Image();
catImg.src = 'assets/black.png'; 

let state, player, bullets, enemies, drops, particles, bloodSplats, stars;

// 單一且完整的圖片載入處理
catImg.onload = function() {
  const targetHeight = 85; // 貓咪的高度，可以改這個數字來調整大小
  const ratio = this.naturalWidth / this.naturalHeight;
  player.h = targetHeight;
  player.w = targetHeight * ratio;
  console.log("新貓咪圖案載入成功，寬高比已自動校正");
};

function initGame() {
  state = { frame:0, score:0, paused:false, over:false,
            shake:0, shakeX:0, shakeY:0,
            spawnTimer:0, spawnInterval:80, berserk:0 };
  player = {
    x: 100, y: H/2, w: 46, h: 38, speed: 5.0, // 橫向遊戲速度稍微調快一點
    hp:5, maxHp:5, cans:3,
    exp:0, expNext:80, level:1,
    invincible:0, boneSize:1, boneCount:1,
    fireCooldown:0,
    biteActive:false, biteTimer:0, biteCooldown:0,
    tail:[]
  };
  bullets=[]; enemies=[]; drops=[]; particles=[]; bloodSplats=[];
  stars = Array.from({length:100}, () => ({
    x:Math.random()*W, y:Math.random()*H,
    r:Math.random()*1.5+0.3,
    speed:Math.random()*0.8+0.2,
    bright:Math.random()
  }));
}

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault(); tryBite();}
  if(e.code==='KeyZ') tryShoot();
  if(e.code==='KeyP') state.paused=!state.paused;
  if(e.code==='Enter' && state.over) initGame();
});
document.addEventListener('keyup', e => keys[e.code]=false);

function rand(a,b){return Math.random()*(b-a)+a;}
function randInt(a,b){return Math.floor(rand(a,b+1));}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

function tryShoot(){
  if(player.fireCooldown>0||state.over||state.paused) return;
  const sz=player.boneSize, n=player.boneCount;
  const offsets=n===1?[0]:n===2?[-13,13]:[-22,0,22];
  const angles =n===1?[0]:n===2?[-0.09,0.09]:[-0.13,0,0.13];
  offsets.forEach((ox,i)=>{
    bullets.push({
      x:player.x + player.w/2, y:player.y,
      vx:angles[i]*4 + 7, vy:angles[i]*4, // 橫向發射
      w:Math.round(20*sz), h:Math.round(7*sz),
      dmg:1+Math.floor((sz-1)*1.5)
    });
  });
  player.fireCooldown=14-Math.min(6,player.level);
}

function tryBite(){
  if(player.biteCooldown>0||state.over||state.paused) return;
  let hitAny=false;
  enemies.forEach(e=>{
    if(!e.dead && dist(player,e)<100){ doHitEnemy(e,9999,true); hitAny=true; }
  });
  player.biteActive=true; player.biteTimer=20; player.biteCooldown=90;
  if(!hitAny) spawnFloat(player.x,player.y-30,'空揮！','#ffaa00',14);
}

function doHitEnemy(e,dmg,isBite=false){
  if(e.dead) return;
  e.hp-=dmg;
  spawnHitParts(e.x,e.y,isBite);
  if(isBite){
    spawnBlood(e.x,e.y);
    state.shake=18;
    const t=['撕碎！','咔嚓！','嘎吱！','爆裂！'];
    spawnFloat(e.x,e.y-15,t[randInt(0,3)],'#ff1111',20);
    state.score+=25*player.level;
  }
  if(e.hp<=0) killEnemy(e);
}

function killEnemy(e){
  if(e.dead) return;
  e.dead=true;
  state.score+=10*player.level;
  spawnDrops(e.x,e.y,e.type);
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2, sp=rand(1.5,4);
    particles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:30,maxLife:30,color:e.type==='bigMouse'?'#cc8844':'#aaa',size:rand(2,5),isText:false});
  }
}

const ETYPES={
  mouse:      {hp:2, speed:1.5, w:28,h:22,color:'#998877'},
  bigMouse:   {hp:6, speed:0.8, w:44,h:36,color:'#776655'},
  speedMouse: {hp:1, speed:3.2, w:22,h:18,color:'#bbaa99'}
};

function spawnDrops(x,y,type){
  const r=Math.random();
  let dt='meat';
  if(type==='bigMouse') dt=r<0.5?'meat':r<0.75?'can':'milk';
  else if(type==='speedMouse') dt=r<0.6?'meat':r<0.85?'milk':'can';
  else dt=r<0.65?'meat':r<0.82?'can':'milk';
  drops.push({x,y,vy:0, vx:-1.5, type:dt,life:280,bob:0});
}

function spawnHitParts(x,y,isBite){
  const n=isBite?22:7;
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2),sp=rand(1,isBite?7:3.5);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:randInt(16,38),maxLife:38,
      color:isBite?`hsl(${randInt(0,25)},95%,${randInt(35,60)}%)`:'#ffee55',
      size:rand(2,isBite?6:3),isText:false});
  }
}

function spawnBlood(x,y){
  for(let i=0;i<10;i++){
    bloodSplats.push({
      x:x+rand(-35,35),y:y+rand(-25,25),
      r:rand(5,20),life:140,maxLife:140,
      angle:rand(0,Math.PI*2),sx:rand(0.5,1.5)
    });
  }
}

function spawnFloat(x,y,text,color,size=16){
  particles.push({x,y,vx:rand(-0.5,0.5),vy:-1.8,
    life:55,maxLife:55,isText:true,text,color,size});
}

function spawnLevelUp(){
  for(let i=0;i<40;i++){
    const a=(i/40)*Math.PI*2,sp=rand(2,6);
    particles.push({x:player.x,y:player.y,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:50,maxLife:50,color:`hsl(${randInt(40,60)},100%,60%)`,
      size:rand(3,7),isText:false});
  }
  spawnFloat(player.x,player.y-50,`LV.${player.level} 升級！`,'#ffdd00',22);
}

function spawnEnemy(){
  let pool=['mouse'];
  if(player.level>=2) pool.push('speedMouse');
  if(player.level>=3) pool.push('bigMouse');
  const type=pool[randInt(0,pool.length-1)];
  const cfg=ETYPES[type];
  // 敵人改從右邊出現
  enemies.push({
    x:W + cfg.w, y:rand(cfg.h, H-cfg.h),
    ...cfg, type, dead:false,
    moveAngle:rand(0,Math.PI*2), moveTimer:0, flashTimer:0
  });
}

function update(){
  if(state.paused||state.over) return;
  state.frame++;
  state.shake=Math.max(0,state.shake-1.5);
  state.shakeX=state.shake>0?rand(-state.shake*0.6,state.shake*0.6):0;
  state.shakeY=state.shake>0?rand(-state.shake*0.4,state.shake*0.4):0;
  if(state.berserk>0) state.berserk--;

  if(keys['ArrowLeft'] ||keys['KeyA']) player.x-=player.speed;
  if(keys['ArrowRight']||keys['KeyD']) player.x+=player.speed;
  if(keys['ArrowUp']   ||keys['KeyW']) player.y-=player.speed*0.8;
  if(keys['ArrowDown'] ||keys['KeyS']) player.y+=player.speed*0.8;
  player.x=clamp(player.x,player.w/2,W-player.w/2);
  player.y=clamp(player.y,player.h/2,H-player.h/2);
  player.tail.unshift({x:player.x,y:player.y});
  if(player.tail.length>8) player.tail.pop();

  if(keys['KeyZ']) tryShoot();
  player.fireCooldown=Math.max(0,player.fireCooldown-1);
  if(player.biteActive){
    player.biteTimer--;
    if(player.biteTimer<=0) player.biteActive=false;
  }
  player.biteCooldown=Math.max(0,player.biteCooldown-1);
  if(player.invincible>0) player.invincible--;

  // 子彈改為向右飛
  bullets.forEach(b=>{b.x+=b.vx; b.y+=b.vy;});
  bullets=bullets.filter(b=>b.x < W+50);

  state.spawnTimer++;
  const interval=Math.max(30,state.spawnInterval-player.level*4);
  if(state.spawnTimer>=interval){
    state.spawnTimer=0;
    spawnEnemy();
  }

  enemies.forEach(e=>{
    if(e.dead) return;
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
    e.x+=(dx/d)*e.speed;
    e.y+=(dy/d)*e.speed;
    if(e.flashTimer>0) e.flashTimer--;
  });

  bullets.forEach((b,bi)=>{
    enemies.forEach(e=>{
      if(e.dead) return;
      if(Math.abs(b.x-e.x)<(b.w/2+e.w/2)&&Math.abs(b.y-e.y)<(b.h/2+e.h/2)){
        doHitEnemy(e,b.dmg);
        e.flashTimer=8;
        bullets.splice(bi,1);
      }
    });
  });

  if(player.invincible===0&&state.berserk===0){
    enemies.forEach(e=>{
      if(e.dead) return;
      if(dist(player,e)<(player.w/2+e.w/2-5)){
        takeDamage(); e.dead=true;
      }
    });
  }

  drops.forEach(d=>{
    d.bob++; d.x+=d.vx; d.life--;
    if(dist(player,d)<35){collectDrop(d);d.life=0;}
  });
  drops=drops.filter(d=>d.life>0 && d.x > -50);

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.93;p.vy*=0.93;p.life--;});
  particles=particles.filter(p=>p.life>0);
  bloodSplats.forEach(b=>b.life--);
  bloodSplats=bloodSplats.filter(b=>b.life>0);
  enemies=enemies.filter(e=>(!e.dead)&&e.x > -100);

  stars.forEach(s=>{
    s.x-=s.speed; // 星星向左流動
    if(s.x < 0){s.x=W; s.y=Math.random()*H;}
  });

  if(player.exp>=player.expNext){
    player.exp-=player.expNext;
    player.level++;
    player.expNext=Math.floor(player.expNext*1.5);
    player.hp=Math.min(player.maxHp,player.hp+1);
    spawnLevelUp();
  }
}

function takeDamage(){
  if(player.cans>0){
    player.cans--;
    player.invincible=90;
    spawnFloat(player.x,player.y-40,'罐頭保護！','#ffaa44',15);
  } else {
    player.hp--;
    player.invincible=80;
    state.shake=20;
    if(player.hp<=0){state.over=true;}
  }
}

function collectDrop(d){
  if(d.type==='meat'){
    player.exp+=20;
    spawnFloat(d.x,d.y-15,'+20 EXP','#ff9944',13);
  } else if(d.type==='milk'){
    state.berserk=300; player.invincible=300;
    spawnFloat(d.x,d.y-15,'無敵狂暴！','#44aaff',16);
  } else {
    player.cans=Math.min(5, player.cans+1);
    spawnFloat(d.x,d.y-15,'+1 罐頭','#ff8844',14);
  }
}

function drawCat(w, h, berserk) {
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    if (berserk) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#4488ff";
        ctx.filter = "brightness(1.2) hue-rotate(180deg)";
    }
    
    if (catImg.complete && catImg.naturalWidth !== 0) {
        ctx.drawImage(catImg, -w/2, -h/2, w, h);
    } else {
        ctx.fillStyle = '#e8c87a';
        ctx.beginPath(); ctx.arc(0,0,w/2,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

function draw(){
  ctx.save();
  ctx.translate(state.shakeX,state.shakeY);
  ctx.fillStyle='#080810';
  ctx.fillRect(0,0,W,H);

  stars.forEach(s=>{
    ctx.globalAlpha=s.bright;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  bloodSplats.forEach(b=>{
    ctx.globalAlpha=(b.life/b.maxLife)*0.6;
    ctx.fillStyle='#880000';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  });

  drops.forEach(d=>{
    ctx.font='20px serif'; ctx.textAlign='center';
    ctx.fillText(d.type==='meat'?'🥩':d.type==='milk'?'🥛':'🥫',d.x,d.y+Math.sin(d.bob*0.1)*5);
  });

  enemies.forEach(e=>{
    if(e.dead) return;
    ctx.save(); ctx.translate(e.x,e.y);
    ctx.fillStyle=e.color;
    ctx.beginPath(); ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  bullets.forEach(b=>{
    ctx.fillStyle='#f0e8c0';
    ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
  });

  if(!(player.invincible > 0 && Math.floor(state.frame/5)%2===0)){
    ctx.save(); 
    ctx.translate(player.x, player.y);
    drawCat(player.w, player.h, state.berserk > 0);
    ctx.restore();
  }

  particles.forEach(p=>{
    ctx.globalAlpha=p.life/p.maxLife;
    if(p.isText){
      ctx.fillStyle=p.color; ctx.font=`bold ${p.size}px sans-serif`;
      ctx.fillText(p.text,p.x,p.y);
    } else {
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    }
  });
  ctx.globalAlpha=1;
  ctx.restore();

  drawHUD();
  if(state.paused) drawOverlay('暫停中','按 P 繼續','#ffcc00');
  if(state.over)   drawOverlay('GAME OVER',`得分：${state.score}　按 Enter 重試`,'#ff3333');
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,40);
  ctx.fillStyle='#fff'; ctx.font='14px sans-serif';
  ctx.textAlign='left'; ctx.fillText(`HP: ${player.hp}  LV: ${player.level}  Score: ${state.score}`, 20, 25);
  // 經驗值條
  ctx.fillStyle='#333'; ctx.fillRect(0,H-5,W,5);
  ctx.fillStyle='#ffaa00'; ctx.fillRect(0,H-5,W*(player.exp/player.expNext),5);
}

function drawOverlay(title,sub,color){
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.fillStyle=color; ctx.font='bold 40px sans-serif';
  ctx.fillText(title,W/2,H/2-20);
  ctx.fillStyle='#fff'; ctx.font='18px sans-serif';
  ctx.fillText(sub,W/2,H/2+30);
}

function loop(){update();draw();requestAnimationFrame(loop);}
initGame();
loop();
</script>
</body>
</html>
